apiVersion: v1
kind: Pod
metadata:
  name: demo-app
  namespace: controller
  labels:
    app: demo
  annotations:
    existing: "true"
spec:
  containers:
  - name: web
    image: nginx:1.25-alpine
    ports:
      - name: http
        containerPort: 80
    env:
      - name: ENVIRONMENT
        value: "staging"
    resources:
      requests:
        cpu:    "100m"
        memory: "128Mi"
      limits:
        cpu:    "250m"
        memory: "256Mi"
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
    # mount a simple ConfigMap (assumes you’ve created one named demo-config)
    volumeMounts:
      - name: config
        mountPath: /etc/demo-config
  # attach that ConfigMap volume
  volumes:
    - name: config
      configMap:
        name: demo-config