name: "CI & Docker Publish"

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ "**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          go-version: 1.24
      - name: Setup Go
        uses: actions/setup-go@v5
      - name: Run unit tests
        run: |
          make test
      #    make test-e2e >> skip this for now, dont really want to do k8s test on test
  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up QEMU (for multi-arch, optional)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read version
        id: version
        run: |
          raw=$(<VERSION)
          version=$(echo "$raw" | grep -Eo '^v[0-9]+\.[0-9]+\.[0-9]+')
          if [[ -z "$version" ]]; then exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build & push image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/annotation-controller-test:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/annotation-controller-test:${{ github.sha }}

      - name: Logout
        run: docker logout



 